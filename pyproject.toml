[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"


[project]
name = "antivist-python"
version = "0.1.0"
description = "Official Python SDK for the Antivist Markets API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<1.0",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
